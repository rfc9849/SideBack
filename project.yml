name: SideBack
options:
  bundleIdPrefix: dev.sideback
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
targets:
  SideBackCore:
    type: framework
    platform: macOS
    sources: [Sources/SideBackCore]
    settings:
      base:
        MACH_O_TYPE: staticlib
        PRODUCT_BUNDLE_IDENTIFIER: dev.sideback.core
        SKIP_INSTALL: YES
  SideBack:
    type: application
    platform: macOS
    sources:
      - Sources/SideBack
    dependencies:
      - target: SideBackCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sideback.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "SideBack"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  SideBackCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SideBackCoreTests
      - Sources/SideBack/Services/SettingsStore.swift
      - Sources/SideBack/Services/InstalledApplicationScanner.swift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: SideBackCore
        embed: false
schemes:
  SideBack:
    build:
      targets:
        SideBack: all
        SideBackCoreTests: [test]
    test:
      targets: [SideBackCoreTests]
